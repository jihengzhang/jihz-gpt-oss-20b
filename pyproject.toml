[project]
name = "gpt-oss"
description = "A collection of reference inference implementations for gpt-oss by OpenAI"

# Core dependencies - minimal required for basic functionality
dependencies = [
  "openai-harmony>=0.0.8",
  "tiktoken>=0.9.0",
  "aiohttp>=3.12.14",
  "chz>=0.3.0",
  "pydantic>=2.11.7,<3.0.0",
  "structlog>=25.4.0",
  "tenacity>=9.1.2",
  "requests>=2.31.0",
  "termcolor>=2.0.0",
]
readme = "README.md"
requires-python = ">=3.12"
version = "0.0.8"

[project.optional-dependencies]
# Server dependencies - for running API server
server = [
  "fastapi>=0.116.1",
  "uvicorn>=0.35.0",
  "sse-starlette>=3.1.0",
]

# Browser/web tools dependencies
web = [
  "docker>=7.1.0",
  "html2text>=2025.4.15",
  "lxml>=4.9.4",
]

# Jupyter integration
jupyter = [
  "jupyter-client>=8.6.3",
  "ipykernel>=6.29.0",
]

# PyTorch inference backend
torch = [
  "torch>=2.7.0,<3.0.0",
  "safetensors>=0.5.3",
  "numpy>=1.24.0",
]

# Triton inference backend (includes torch)
triton = [
  "torch>=2.7.0,<3.0.0",
  "triton>=3.4.0,<4.0.0",
  "safetensors>=0.5.3",
  "numpy>=1.24.0",
]

# vLLM inference backend (high-performance serving)
# Note: vLLM has strict version requirements, use exact versions to avoid conflicts
# Updated: 2026-01-13 based on successful installation
vllm = [
  "vllm==0.13.0",
  "torch==2.9.0",
  "torchaudio==2.9.0",
  "torchvision==0.24.0",
  "transformers==4.57.3",  # Exact version from installation
  "tokenizers==0.22.2",    # Exact version from installation
  "numpy>=2.2.0,<2.3",     # Updated to match installed 2.2.6
  "outlines_core==0.2.11",
]

# Metal inference backend (Apple Silicon)
metal = [
  "numpy>=1.24.0",
  "tqdm>=4.66.0",
  "safetensors>=0.5.3",
  "torch>=2.7.0,<3.0.0",
]

# Testing dependencies
test = [
  "pytest>=8.4.1",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.28.1",
]

# Evaluation dependencies
eval = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "openai>=2.0.0",
  "jinja2>=3.1.0",
  "tqdm>=4.66.0",
  "blobfile>=2.0.0",
]

# MCP server dependencies
mcp = [
  "mcp>=1.25.0",
  "anthropic>=0.71.0",
]

# Complete installation with all backends
all = [
  "gpt-oss[server,web,jupyter,torch,triton,vllm,metal,eval,mcp]",
]

# Development dependencies
dev = [
  "gpt-oss[all,test]",
  "black>=25.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "gpt_oss_build_backend.backend"
backend-path = ["_build"]

[tool.setuptools.packages.find]
include = ["gpt_oss*"]

[tool.scikit-build]
cmake.source-dir = "." # pick up the root CMakeLists.txt
cmake.args = [
  "-DGPTOSS_BUILD_PYTHON=ON",
  "-DCMAKE_BUILD_TYPE=Release",
  "-DBUILD_SHARED_LIBS=OFF",
]
[tool.scikit-build.wheel]
packages = ["gpt_oss"] # copy the whole Python package tree
